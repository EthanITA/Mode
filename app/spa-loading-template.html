<style>
  /* Drawn before any stylesheet loads, so the theme the head script stamped picks the browser's own canvas. */
  :root[data-theme="dark"] {
    color-scheme: dark;
  }

  #__nuxt-loader {
    display: grid;
    inset: 0;
    place-items: center;
    pointer-events: none;
    position: fixed;
  }

  /* The veil's loader: it waits before showing, so a quick start never flashes it. */
  .boot {
    animation:
      boot-in var(--duration-fast, 180ms) ease-out var(--duration-slow, 400ms) both,
      boot-spin var(--duration-spin, 750ms) linear infinite;
    color: GrayText;
    height: 20px;
    width: 20px;
  }

  @keyframes boot-in {
    from {
      opacity: 0;
    }
  }

  @keyframes boot-spin {
    to {
      rotate: 360deg;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .boot {
      animation: boot-in var(--duration-fast, 180ms) ease-out var(--duration-slow, 400ms) both;
    }
  }
</style>
<svg class="boot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
  <path d="M21 12a9 9 0 1 1-6.219-8.56" />
</svg>
