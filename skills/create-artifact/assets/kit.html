<!-- cx:start -->
<style>
/* Fallback chains, so the kit reads the generic contract and the self-contained packs' own names alike. */
:root {
  --cx-bg: var(--bg, var(--canvas, Canvas));
  --cx-surface: var(--surface, var(--raised, var(--panel-solid, Canvas)));
  --cx-surface-2: var(--surface-2, var(--sunken, var(--bg-tint, var(--cx-bg))));
  --cx-ink: var(--ink, CanvasText);
  --cx-muted: var(--muted, var(--ink-soft, GrayText));
  --cx-faint: var(--faint, var(--subtle, var(--ink-faint, GrayText)));
  --cx-border: var(--border, var(--hair, GrayText));
  --cx-border-strong: var(--border-strong, var(--hair-strong, var(--cx-border)));
  --cx-accent: var(--primary, var(--accent, var(--gold, LinkText)));
  --cx-accent-ink: var(--primary-content, var(--accent-ink, Canvas));
  --cx-accent-soft: var(--primary-soft, var(--accent-soft, color-mix(in srgb, var(--cx-accent) 14%, transparent)));
  --cx-ok: var(--ok, var(--success, var(--seine, CanvasText)));
  --cx-ok-soft: var(--ok-soft, var(--success-soft, color-mix(in srgb, var(--cx-ok) 14%, transparent)));
  --cx-warn: var(--warn, var(--warning, var(--gold, CanvasText)));
  --cx-warn-soft: var(--warn-soft, var(--warning-soft, color-mix(in srgb, var(--cx-warn) 14%, transparent)));
  --cx-bad: var(--bad, var(--error, var(--rose, CanvasText)));
  --cx-bad-soft: var(--bad-soft, var(--error-soft, color-mix(in srgb, var(--cx-bad) 14%, transparent)));
  --cx-radius: var(--radius, var(--radius-box, 12px));
  --cx-radius-sm: var(--radius-sm, var(--radius-field, 8px));
  --cx-sans: var(--sans, system-ui, sans-serif);
  --cx-mono: var(--mono, ui-monospace, monospace);
  --cx-ease: cubic-bezier(.23, 1, .32, 1);
}

/* A pack rule such as display:flex would otherwise beat the hidden attribute the runtime sets. */
[data-cx] [hidden] { display: none !important; }

.cx-label {
  font-family: var(--cx-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--cx-muted);
}

.cx-wrap { max-width: 70rem; margin-inline: auto; padding-inline: 1.25rem; }
.cx-accent { color: var(--cx-accent); }

.cx-topbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-height: 4.1rem;
  padding: 0 4.5rem 0 1.25rem;
  background: color-mix(in srgb, var(--cx-bg) 86%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--cx-border);
  font-size: .9rem;
}
.cx-topbar > strong { white-space: nowrap; }

/* Zero specificity, so a pack that styles .theme-toggle always wins and one that does not still gets a button. */
:where([data-cx="theme"]) {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 50;
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--cx-border);
  border-radius: 999px;
  background: var(--cx-surface);
  color: var(--cx-muted);
  cursor: pointer;
}
:where([data-cx="theme"] svg) { width: 16px; height: 16px; }
:where([data-cx="theme"] .i-sun) { display: none; }
:where(:root[data-theme="dark"] [data-cx="theme"] .i-sun) { display: block; }
:where(:root[data-theme="dark"] [data-cx="theme"] .i-moon) { display: none; }
:where([data-cx="theme"]:focus-visible) { outline: 2px solid var(--cx-accent); outline-offset: 2px; }

.cx-rail { display: none; min-width: 0; }
@media (min-width: 52rem) {
  .cx-rail { display: block; overflow-x: auto; scrollbar-width: none; }
}
.cx-rail ol { display: flex; gap: .25rem; margin: 0; padding: 0; list-style: none; }
.cx-rail li + li { margin-top: 0; }
.cx-rail a {
  display: block;
  padding: .35rem .65rem;
  border-radius: 999px;
  color: var(--cx-muted);
  font-size: .82rem;
  text-decoration: none;
  white-space: nowrap;
  transition: color .15s ease, background-color .15s ease;
}
.cx-rail a[aria-current="true"] { color: var(--cx-ink); background: var(--cx-surface-2); font-weight: 600; }
.cx-rail a:focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 2px; }
@media (hover: hover) and (pointer: fine) {
  .cx-rail a:hover { color: var(--cx-ink); }
}

.cx-hero {
  position: relative;
  display: grid;
  align-items: center;
  min-height: 34rem;
  padding: 7rem 0 3.5rem;
  overflow: hidden;
}
.cx-hero > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cx-hero > .cx-wrap { position: relative; z-index: 1; }
.cx-hero h1 {
  margin: .6rem 0 1rem;
  font-size: clamp(2.2rem, 1.4rem + 3.6vw, 4rem);
  line-height: 1.04;
  letter-spacing: -.025em;
  text-wrap: balance;
}
.cx-lede {
  max-width: 60ch;
  margin: 0;
  font-size: clamp(1.05rem, 1rem + .4vw, 1.25rem);
  line-height: 1.55;
  color: var(--cx-muted);
}
.cx-hero > .cx-wrap > * + * { margin-top: 1rem; }
.cx-hero .cx-lede + * { margin-top: 1.75rem; }

.cx-chapter { padding: 4rem 0; border-top: 1px solid var(--cx-border); scroll-margin-top: 4.1rem; }
.cx-chapter > .cx-wrap > * + * { margin-top: 1.1rem; }
.cx-chapter p { max-width: 70ch; }
.cx-chapter-head { display: flex; align-items: baseline; gap: .75rem; }
.cx-chapter-head h2 {
  margin: 0;
  font-size: clamp(1.45rem, 1.2rem + 1vw, 2rem);
  letter-spacing: -.015em;
  text-wrap: balance;
}
.cx-num { font-family: var(--cx-mono); font-size: .78rem; color: var(--cx-faint); font-variant-numeric: tabular-nums; }

.cx-figure {
  margin: 0;
  border: 1px solid var(--cx-border);
  border-radius: var(--cx-radius);
  background: var(--cx-surface);
  overflow: hidden;
}
.cx-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: .9rem 1.5rem;
  padding: .9rem 1rem;
  border-bottom: 1px solid var(--cx-border);
  background: var(--cx-surface-2);
}
.cx-body { padding: 1.25rem 1rem; overflow-x: auto; }
.cx-body > * + * { margin-top: 1rem; }
.cx-caption {
  padding: .75rem 1rem;
  border-top: 1px solid var(--cx-border);
  font-size: .85rem;
  line-height: 1.5;
  color: var(--cx-muted);
}
.cx-figure output { font-variant-numeric: tabular-nums; }

.cx-control { display: grid; gap: .35rem; }
.cx-control > .cx-row { display: flex; align-items: center; gap: .6rem; }
.cx-control input[type="range"] { width: 12rem; accent-color: var(--cx-accent); }
.cx-control input[type="checkbox"] { accent-color: var(--cx-accent); }
.cx-control input[type="number"],
.cx-control select {
  font: inherit;
  font-size: .85rem;
  padding: .32rem .55rem;
  border: 1px solid var(--cx-border);
  border-radius: var(--cx-radius-sm);
  background: var(--cx-surface);
  color: var(--cx-ink);
}
.cx-control input[type="number"] { width: 7rem; }
.cx-control output { font-family: var(--cx-mono); font-size: .85rem; color: var(--cx-ink); min-width: 4ch; }
.cx-control :focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 2px; }

.cx-seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--cx-border);
  border-radius: 999px;
  background: var(--cx-surface);
}
.cx-seg > button {
  font: inherit;
  font-size: .82rem;
  line-height: 1.2;
  padding: .38rem .8rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--cx-muted);
  cursor: pointer;
  transition: background-color .16s ease, color .16s ease, transform .12s var(--cx-ease);
}
.cx-seg > button[aria-pressed="true"] { background: var(--cx-accent); color: var(--cx-accent-ink); font-weight: 600; }
.cx-seg > button:active { transform: scale(.97); }
.cx-seg > button:focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 2px; }
@media (hover: hover) and (pointer: fine) {
  .cx-seg > button:hover:not([aria-pressed="true"]) { color: var(--cx-ink); background: var(--cx-surface-2); }
}

.cx-steps { margin: 0; padding: 0; list-style: none; }
.cx-step { position: relative; margin: 0; padding: .4rem 0 .4rem 1.75rem; }
.cx-step::before {
  content: "";
  position: absolute;
  left: .3rem;
  top: .85rem;
  width: .62rem;
  height: .62rem;
  border-radius: 999px;
  background: var(--cx-border-strong);
}
.cx-step + .cx-step::after {
  content: "";
  position: absolute;
  left: calc(.61rem - .5px);
  top: -.3rem;
  height: 1.05rem;
  width: 1px;
  background: var(--cx-border-strong);
}
.cx-step[data-state="ok"]::before { background: var(--cx-ok); }
.cx-step[data-state="warn"]::before { background: transparent; box-shadow: inset 0 0 0 2px var(--cx-warn); }
.cx-step[data-state="bad"]::before { background: var(--cx-bad); box-shadow: 0 0 0 4px var(--cx-bad-soft); }
.cx-out {
  display: block;
  font-family: var(--cx-mono);
  font-size: .8rem;
  color: var(--cx-muted);
  overflow-wrap: anywhere;
}

.cx-verdict {
  padding: .9rem 1.1rem;
  border: 1px solid var(--cx-border);
  border-left: 3px solid var(--cx-accent);
  border-radius: var(--cx-radius-sm);
  background: var(--cx-accent-soft);
  color: var(--cx-ink);
}
.cx-verdict[data-tone="ok"] { border-left-color: var(--cx-ok); background: var(--cx-ok-soft); }
.cx-verdict[data-tone="warn"] { border-left-color: var(--cx-warn); background: var(--cx-warn-soft); }
.cx-verdict[data-tone="bad"] { border-left-color: var(--cx-bad); background: var(--cx-bad-soft); }
.cx-verdict > strong:first-child { display: block; font-size: 1.05rem; }

.cx-bars { display: grid; gap: .5rem; margin: 0; padding: 0; list-style: none; }
.cx-bar {
  display: grid;
  grid-template-columns: minmax(6rem, 14rem) 1fr;
  align-items: center;
  gap: .75rem;
  margin: 0;
  font-size: .88rem;
}
.cx-bars > .cx-bar + .cx-bar { margin-top: 0; }
.cx-track {
  display: flex;
  align-items: center;
  gap: .5rem;
  min-height: 1.5rem;
  font-family: var(--cx-mono);
  font-size: .82rem;
  color: var(--cx-ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* Width, not scaleX, because a scaled fill squashes its rounded end; the 5rem keeps the value inside the row. */
.cx-fill {
  flex: none;
  width: calc(var(--v, 0) * (100% - 5rem));
  height: .75rem;
  border-radius: 0 4px 4px 0;
  background: var(--cx-muted);
  transition: width .3s var(--cx-ease);
}
.cx-bar[data-tone="accent"] .cx-fill { background: var(--cx-accent); }

.cx-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.25rem; margin-bottom: .6rem; }
.cx-tools .cx-control { display: flex; align-items: center; gap: .5rem; }
.cx-search {
  min-width: 14rem;
  font: inherit;
  font-size: .85rem;
  padding: .4rem .8rem;
  border: 1px solid var(--cx-border);
  border-radius: 999px;
  background: var(--cx-surface);
  color: var(--cx-ink);
}
.cx-search:focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 2px; }
.cx-count { margin-left: auto; font-family: var(--cx-mono); font-size: .78rem; color: var(--cx-muted); font-variant-numeric: tabular-nums; }

.cx-table { overflow-x: auto; border: 1px solid var(--cx-border); border-radius: var(--cx-radius); background: var(--cx-surface); }
.cx-table table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.cx-table caption {
  caption-side: top;
  padding: .7rem 1rem;
  border-bottom: 1px solid var(--cx-border);
  text-align: left;
  font-size: .85rem;
  color: var(--cx-muted);
}
.cx-table th,
.cx-table td { padding: .55rem 1rem; border-bottom: 1px solid var(--cx-border); text-align: left; vertical-align: top; }
.cx-table th {
  background: var(--cx-surface-2);
  font-family: var(--cx-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--cx-muted);
  white-space: nowrap;
}
.cx-table tbody tr:last-child td { border-bottom: 0; }
.cx-table .cx-n { text-align: right; font-family: var(--cx-mono); font-variant-numeric: tabular-nums; }
.cx-sort {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
  cursor: pointer;
}
.cx-sort::after { content: "\2195"; opacity: .35; }
[aria-sort="ascending"] > .cx-sort::after { content: "\2191"; opacity: 1; }
[aria-sort="descending"] > .cx-sort::after { content: "\2193"; opacity: 1; }
.cx-sort:focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 2px; }

.cx-more { border-top: 1px solid var(--cx-border); }
.cx-more:last-of-type { border-bottom: 1px solid var(--cx-border); }
.cx-more + .cx-more { margin-top: 0; }
.cx-more > summary {
  display: flex;
  align-items: baseline;
  gap: .6rem;
  padding: .75rem 0;
  font-weight: 600;
  list-style: none;
  cursor: pointer;
}
.cx-more > summary::-webkit-details-marker { display: none; }
.cx-more > summary::after { content: "+"; margin-left: auto; font-family: var(--cx-mono); color: var(--cx-muted); }
.cx-more[open] > summary::after { content: "\2212"; }
.cx-more[data-tone] > summary::before {
  content: "";
  flex: none;
  width: .55rem;
  height: .55rem;
  border-radius: 999px;
  background: var(--cx-accent);
  transform: translateY(-.05rem);
}
.cx-more[data-tone="ok"] > summary::before { background: var(--cx-ok); }
.cx-more[data-tone="warn"] > summary::before { background: transparent; box-shadow: inset 0 0 0 2px var(--cx-warn); }
.cx-more[data-tone="bad"] > summary::before { background: var(--cx-bad); box-shadow: 0 0 0 3px var(--cx-bad-soft); }
.cx-more > summary:focus-visible { outline: 2px solid var(--cx-accent); outline-offset: 2px; }
.cx-more > :not(summary) { max-width: 70ch; margin: 0; padding: 0 0 .9rem; color: var(--cx-muted); }
</style>
<script>
(() => {
  const root = document.documentElement;
  if (!root.getAttribute('data-theme')) root.setAttribute('data-theme', 'light');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // The pack's reveal hides only under .js, so it is added only where the observer that shows it again exists.
  if ('IntersectionObserver' in window && !reduce) root.classList.add('js');

  const lang = root.lang || undefined;
  const warned = new Set();
  const warn = (what, e) => {
    if (warned.has(what)) return;
    warned.add(what);
    console.warn('cx: ' + what, e || '');
  };

  const formats = new Map();
  const formatter = (spec) => {
    if (!formats.has(spec)) {
      const [kind, a, b] = spec.split(':');
      const o = {};
      if (kind === 'int') o.maximumFractionDigits = 0;
      else if (kind === 'number' && a) o.minimumFractionDigits = o.maximumFractionDigits = +a;
      else if (kind === 'percent') Object.assign(o, { style: 'percent', maximumFractionDigits: +(a || 0) });
      else if (kind === 'currency') {
        Object.assign(o, { style: 'currency', currency: a || 'EUR' });
        if (b) o.minimumFractionDigits = o.maximumFractionDigits = +b;
      } else if (kind === 'compact') Object.assign(o, { notation: 'compact', maximumFractionDigits: 1 });
      try {
        formats.set(spec, new Intl.NumberFormat(lang, o));
      } catch (e) {
        warn('format ' + spec, e);
        formats.set(spec, new Intl.NumberFormat(lang));
      }
    }
    return formats.get(spec);
  };
  const format = (v, spec) => typeof v === 'number' ? formatter(spec || '').format(v) : String(v);

  const compiled = new Map();
  const IDENT = /^[A-Za-z_$][\w$]*$/;
  const run = (expr, scope) => {
    try {
      const names = Object.keys(scope).filter((n) => IDENT.test(n)).sort();
      const key = names.join(',') + '|' + expr;
      if (!compiled.has(key)) compiled.set(key, new Function(...names, 'return (' + expr + ');'));
      const v = compiled.get(key)(...names.map((n) => scope[n]));
      if (typeof v === 'number' && !isFinite(v)) throw new Error('not a finite number');
      return { v };
    } catch (e) {
      warn(expr, e);
    }
  };

  const stepIn = (el) => {
    if (reduce || !el.animate) return;
    const steps = el.matches('.cx-step') ? [el] : [...el.querySelectorAll('.cx-step')];
    (steps.length ? steps : [el]).forEach((s, i) => s.animate(
      [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 240, delay: Math.min(i, 10) * 90, easing: 'cubic-bezier(.23, 1, .32, 1)', fill: 'backwards' }
    ));
  };
  const show = (el, on, animate) => {
    if (el.hidden === !on) return;
    el.hidden = !on;
    if (on && animate) stepIn(el);
  };

  const coerce = (s) => s !== '' && isFinite(Number(s)) ? Number(s) : s;
  const press = (group, button) => group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));

  const read = (fig) => {
    const scope = {};
    fig.querySelectorAll('[data-cx-name]').forEach((g) => {
      const on = g.querySelector('button[aria-pressed="true"]');
      if (on) scope[g.getAttribute('data-cx-name')] = coerce(on.value);
    });
    fig.querySelectorAll('input[name], select[name]').forEach((el) => {
      if (el.type === 'checkbox') scope[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) scope[el.name] = coerce(el.value); }
      else scope[el.name] = coerce(el.value);
    });
    return scope;
  };

  const REACTIVE = '[data-cx-expr], [data-cx-show], [data-cx-pick], [data-cx-bar]';
  const apply = (el, scope, animate) => {
    if (el.hasAttribute('data-cx-expr')) {
      const r = run(el.getAttribute('data-cx-expr'), scope);
      if (r) {
        el.textContent = format(r.v, el.getAttribute('data-cx-format'));
        const name = el.getAttribute('name');
        if (name) scope[name] = r.v;
      }
    }
    if (el.hasAttribute('data-cx-bar')) {
      const r = run(el.getAttribute('data-cx-bar'), scope);
      const v = Number(r?.v);
      if (r && isFinite(v)) el.style.setProperty('--v', String(Math.max(0, Math.min(1, v))));
      else if (r) warn('bar ' + el.getAttribute('data-cx-bar'), 'not a number');
    }
    if (el.hasAttribute('data-cx-show')) {
      const r = run(el.getAttribute('data-cx-show'), scope);
      if (r) show(el, Boolean(r.v), animate);
    }
    if (el.hasAttribute('data-cx-pick')) {
      let picked = false;
      [...el.children].forEach((c) => {
        const when = c.getAttribute('data-cx-when');
        const hit = !picked && (!when || Boolean(run(when, scope)?.v));
        if (hit) picked = true;
        show(c, hit, animate);
      });
    }
  };

  const figure = (fig) => {
    // Named outputs first, so a bar or a block may sit before the value it reads.
    const update = (animate) => {
      const scope = read(fig);
      const nodes = [...fig.querySelectorAll(REACTIVE)];
      const named = (el) => el.hasAttribute('name') && el.hasAttribute('data-cx-expr');
      nodes.filter(named).forEach((el) => apply(el, scope, animate));
      nodes.filter((el) => !named(el)).forEach((el) => apply(el, scope, animate));
    };
    fig.querySelectorAll('[data-cx-name]').forEach((g) => g.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || !g.contains(b)) return;
      press(g, b);
      update(true);
    }));
    fig.addEventListener('input', () => update(true));
    fig.addEventListener('change', () => update(true));
    fig.querySelectorAll('[data-cx-pick]:not([aria-live])').forEach((p) => p.setAttribute('aria-live', 'polite'));
    update(false);
  };

  const table = (t) => {
    const body = t.tBodies[0];
    if (!body) return;
    const rows = [...body.rows];
    const heads = t.tHead ? [...t.tHead.rows[0].cells] : [];
    const text = (row, col) => (row.cells[col]?.textContent || '').trim();
    const num = (row, col) => {
      const cell = row.cells[col];
      const s = (cell?.getAttribute('data-cx-value') || text(row, col)).trim();
      return s === '' ? NaN : Number(s);
    };
    const host = t.closest('.cx-table') || t;
    const tools = document.createElement('div');
    tools.className = 'cx-tools';

    const search = document.createElement('input');
    search.type = 'search';
    search.className = 'cx-search';
    search.placeholder = t.getAttribute('data-cx-search') || 'Filter rows';
    search.setAttribute('aria-label', search.placeholder);
    tools.append(search);

    const facets = [];
    heads.forEach((th, col) => {
      if (!th.hasAttribute('data-cx-facet')) return;
      const facet = { col, value: '' };
      facets.push(facet);
      const control = document.createElement('div');
      control.className = 'cx-control';
      const label = document.createElement('span');
      label.className = 'cx-label';
      label.textContent = th.textContent.trim();
      const group = document.createElement('div');
      group.className = 'cx-seg';
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', label.textContent);
      ['', ...new Set(rows.map((r) => text(r, col)))].forEach((v) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.value = v;
        b.textContent = v || t.getAttribute('data-cx-all') || 'All';
        b.setAttribute('aria-pressed', String(v === ''));
        group.append(b);
      });
      group.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        facet.value = b.value;
        press(group, b);
        filter();
      });
      control.append(label, group);
      tools.append(control);
    });

    const count = document.createElement('output');
    count.className = 'cx-count';
    count.setAttribute('aria-live', 'polite');
    tools.append(count);
    host.before(tools);

    const template = t.getAttribute('data-cx-count') || '{n} of {total} rows';
    const filter = () => {
      const q = search.value.trim().toLowerCase();
      let n = 0;
      rows.forEach((r) => {
        const on = (!q || r.textContent.toLowerCase().includes(q)) && facets.every((f) => !f.value || text(r, f.col) === f.value);
        r.hidden = !on;
        if (on) n++;
      });
      count.textContent = template.replace('{n}', format(n)).replace('{total}', format(rows.length));
    };
    search.addEventListener('input', filter);

    const collator = new Intl.Collator(lang, { numeric: true, sensitivity: 'base' });
    heads.forEach((th, col) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cx-sort';
      b.append(...th.childNodes);
      th.append(b);
      b.addEventListener('click', () => {
        const dir = th.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
        heads.forEach((h) => h.removeAttribute('aria-sort'));
        th.setAttribute('aria-sort', dir);
        const numeric = rows.every((r) => isFinite(num(r, col)));
        const sign = dir === 'ascending' ? 1 : -1;
        rows.sort((a, z) => sign * (numeric ? num(a, col) - num(z, col) : collator.compare(text(a, col), text(z, col))));
        body.append(...rows);
      });
    });
    filter();
  };

  const rail = (nav) => {
    const links = [...nav.querySelectorAll('a[href^="#"]')];
    const byId = new Map(links.map((a) => [decodeURIComponent(a.hash.slice(1)), a]));
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => a.setAttribute('aria-current', String(a === byId.get(e.target.id))));
    }), { rootMargin: '-45% 0px -50% 0px' });
    byId.forEach((_, id) => {
      const target = document.getElementById(id);
      if (target) io.observe(target);
    });
  };

  const theme = (button) => {
    const label = () => button.setAttribute('aria-label',
      root.getAttribute('data-theme') === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    button.addEventListener('click', () => {
      root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      label();
      dispatchEvent(new CustomEvent('themechange'));
    });
    label();
  };

  const reveal = () => {
    if (!root.classList.contains('js')) return;
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.classList.add('is-in');
      io.unobserve(e.target);
    }), { rootMargin: '0px 0px -12% 0px' });
    document.querySelectorAll('.reveal').forEach((el) => {
      if (!el.style.getPropertyValue('--d') && el.parentNode) {
        const i = [...el.parentNode.children].filter((c) => c.classList.contains('reveal')).indexOf(el);
        el.style.setProperty('--d', String(Math.min(Math.max(i, 0), 5)));
      }
      io.observe(el);
    });
  };

  const countUp = () => {
    if (reduce || !('IntersectionObserver' in window)) return;
    document.querySelectorAll('[data-count]').forEach((el) => {
      const to = Number(el.getAttribute('data-count'));
      if (!isFinite(to)) return;
      const io = new IntersectionObserver((entries) => {
        if (!entries[0].isIntersecting) return;
        io.disconnect();
        const dur = 900;
        const t0 = performance.now();
        let done = false;
        const settle = () => { if (!done) { done = true; el.textContent = format(to); } };
        requestAnimationFrame(function step(now) {
          const p = Math.min(1, (now - t0) / dur);
          el.textContent = format(Math.round(to * (1 - Math.pow(1 - p, 3))));
          if (p < 1) requestAnimationFrame(step); else settle();
        });
        // A backgrounded tab throttles rAF and would leave the number frozen mid-count.
        setTimeout(settle, dur + 400);
      });
      io.observe(el);
    });
  };

  const components = { figure, table, rail, theme };
  const start = () => {
    document.querySelectorAll('[data-cx]').forEach((el) => {
      const name = el.getAttribute('data-cx');
      const init = components[name];
      if (!init) return warn('no component named ' + name);
      try { init(el); } catch (e) { warn(name, e); }
    });
    try { reveal(); } catch (e) { root.classList.remove('js'); warn('reveal', e); }
    try { countUp(); } catch (e) { warn('count-up', e); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
