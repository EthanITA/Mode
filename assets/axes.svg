<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 358" width="620" height="358" role="img" aria-label="A grid of nine modes down the side against seven styles across the top, making sixty-three combinations. The two axes are independent: picking a mode never constrains which style you can hold, and the cell where debug meets edu is highlighted as one example.">
<style>
  .hd{font:600 12px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#1f2328}
  .ax{font:600 11px ui-sans-serif,sans-serif;fill:#656d76;letter-spacing:.08em}
  .rw{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328}
  .cl{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#656d76}
  .cell{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
  .on{fill:#8250df;stroke:#6639ba}
  .note{font:11px ui-sans-serif,sans-serif;fill:#656d76}
  @media (prefers-color-scheme: dark){
    .hd,.rw{fill:#e6edf3}.ax,.cl,.note{fill:#9198a1}
    .cell{fill:#151b23;stroke:#3d444d}
    .on{fill:#a371f7;stroke:#c297ff}
  }
</style>
<text class="ax" x="118" y="18">STYLE  —  how it sounds</text>
<text class="ax" x="14" y="60" transform="rotate(-90 14 60)">MODE — how it runs</text>

<text class="cl" x="130" y="42" text-anchor="middle">creative</text>
