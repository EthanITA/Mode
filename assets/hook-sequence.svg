<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 285" width="660" height="285" role="img" aria-label="The hook intercepts your message before Claude sees it, asks bin/mode to expire, switch and choose, receives what each slot now holds, and passes Claude the message together with the contract text.">
<style>
  .t{font:600 12px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#1f2328}
  .s{font:10.5px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#656d76}
  .k{font:600 9px ui-sans-serif,sans-serif;fill:#7d4e00;letter-spacing:.07em}
  .b{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .g{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
  .a{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .m{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .ln{stroke:#8c959f;stroke-width:1.5;fill:none}
  .lp{stroke:#8c959f;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  .at{fill:#6639ba}
  @media (prefers-color-scheme: dark){
    .t{fill:#e6edf3}.s{fill:#9198a1}.k{fill:#e3b341}
    .b{fill:#151b23;stroke:#3d444d}
    .g{fill:#2b2412;stroke:#d4a72c}
    .a{fill:#231c33;stroke:#a371f7}
    .m{fill:#0d1117;stroke:#3d444d}
    .ln,.lp{stroke:#6e7681}
    .at{fill:#c297ff}
  }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
<rect class="b" x="28" y="20" width="124" height="30" rx="7"/><text class="t" x="90.0" y="39.0" text-anchor="middle">You</text>
<line class="lp" x1="90" y1="54" x2="90" y2="250"/>
<rect class="b" x="188" y="20" width="124" height="30" rx="7"/><text class="t" x="250.0" y="39.0" text-anchor="middle">The hook</text>
<line class="lp" x1="250" y1="54" x2="250" y2="250"/>
<rect class="b" x="348" y="20" width="124" height="30" rx="7"/><text class="t" x="410.0" y="39.0" text-anchor="middle">bin/mode</text>
<line class="lp" x1="410" y1="54" x2="410" y2="250"/>
<rect class="a" x="508" y="20" width="124" height="30" rx="7"/><text class="t" x="570.0" y="39.0" text-anchor="middle">Claude</text>
<line class="lp" x1="570" y1="54" x2="570" y2="250"/>
<path class="ln" d="M90 84 H250" marker-end="url(#h)"/>
<text class="s" x="170.0" y="78" text-anchor="middle">your message, before Claude sees it</text>
<path class="ln" d="M250 122 H410" marker-end="url(#h)"/>
<text class="s" x="330.0" y="116" text-anchor="middle">expire, switch, choose</text>
<path class="ln" d="M410 160 H250" marker-end="url(#h)"/>
<text class="s" x="330.0" y="154" text-anchor="middle">what each slot now holds</text>
<path class="ln" d="M250 198 H570" marker-end="url(#h)"/>
<text class="s" x="410.0" y="192" text-anchor="middle">message plus the contract text</text>
<text class="s" x="570" y="270" text-anchor="middle">holds by mechanism, not by remembering</text>
</svg>
