<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 228" width="660" height="228" role="img" aria-label="A slot moves between empty, held when you type a name, and auto. While on auto a matching pattern moves it to chosen, marked with a tilde in the status line, and its exit condition returns it to auto rather than to empty.">
<style>
  .t{font:600 12px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#1f2328}
  .s{font:10.5px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#656d76}
  .k{font:600 9px ui-sans-serif,sans-serif;fill:#7d4e00;letter-spacing:.07em}
  .b{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .g{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
  .a{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .m{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .ln{stroke:#8c959f;stroke-width:1.5;fill:none}
  .lp{stroke:#8c959f;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  .at{fill:#6639ba}
  @media (prefers-color-scheme: dark){
    .t{fill:#e6edf3}.s{fill:#9198a1}.k{fill:#e3b341}
    .b{fill:#151b23;stroke:#3d444d}
    .g{fill:#2b2412;stroke:#d4a72c}
    .a{fill:#231c33;stroke:#a371f7}
    .m{fill:#0d1117;stroke:#3d444d}
    .ln,.lp{stroke:#6e7681}
    .at{fill:#c297ff}
  }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
<rect class="b" x="60" y="60" width="116" height="44" rx="7"/><text class="t" x="118.0" y="86.0" text-anchor="middle">empty</text>
<rect class="b" x="300" y="30" width="116" height="44" rx="7"/><text class="t" x="358.0" y="56.0" text-anchor="middle">held</text>
<rect class="b" x="300" y="130" width="116" height="44" rx="7"/><text class="t" x="358.0" y="156.0" text-anchor="middle">auto</text>
<rect class="a" x="520" y="130" width="116" height="44" rx="7"/><text class="t" x="578.0" y="151.0" text-anchor="middle">chosen</text><text class="k" x="578.0" y="167" text-anchor="middle">~ IN THE CHIP</text>
<path class="ln" d="M176 52 C238.0 52 238.0 52 300 52" marker-end="url(#h)"/>
<text class="s" x="238.0" y="45" text-anchor="middle">you type a name</text>
<path class="ln" d="M176 92 C238.0 92 238.0 152 300 152" marker-end="url(#h)"/>
<text class="s" x="238.0" y="85" text-anchor="middle">/mode auto</text>
<path class="ln" d="M416 152 C468.0 152 468.0 152 520 152" marker-end="url(#h)"/>
<text class="s" x="468.0" y="145" text-anchor="middle">a pattern matches</text>
<path class="ln" d="M520 168 C468.0 168 468.0 168 416 168" marker-end="url(#h)"/>
<text class="s" x="468.0" y="161" text-anchor="middle">its exit fires</text>
<path class="lp" d="M358 74 V118" marker-end="url(#h)"/>
<text class="s" x="366" y="100">off</text>
<text class="s" x="20" y="212">A contract you typed is never overridden by a pattern. A message matching two picks neither.</text>
</svg>
