<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 150" width="662" height="150" role="img" aria-label="Swarm triages every request as it arrives rather than once at the start, so what the pipeline records is the handoff to an owner, the verification on the way back, the delivery, and the retiring of owners whose domain has closed. Delivery returns to the handoff because the roster outlives the request that filled it.">
<style>
  .t{font:600 12px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#1f2328}
  .s{font:10.5px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#656d76}
  .k{font:600 9px ui-sans-serif,sans-serif;fill:#7d4e00;letter-spacing:.07em}
  .b{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .g{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
  .a{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .m{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .ln{stroke:#8c959f;stroke-width:1.5;fill:none}
  .lp{stroke:#8c959f;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  .at{fill:#6639ba}
  @media (prefers-color-scheme: dark){
    .t{fill:#e6edf3}.s{fill:#9198a1}.k{fill:#e3b341}
    .b{fill:#151b23;stroke:#3d444d}
    .g{fill:#2b2412;stroke:#d4a72c}
    .a{fill:#231c33;stroke:#a371f7}
    .m{fill:#0d1117;stroke:#3d444d}
    .ln,.lp{stroke:#6e7681}
    .at{fill:#c297ff}
  }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
<rect class="b" x="16" y="46" width="138" height="56" rx="7"/><text class="t" x="85.0" y="78.0" text-anchor="middle">Hand over or hire</text>
<rect class="b" x="180" y="46" width="138" height="56" rx="7"/><text class="t" x="249.0" y="78.0" text-anchor="middle">Verify and wire</text>
<path class="ln" d="M154 74.0 H176" marker-end="url(#h)"/>
<rect class="b" x="344" y="46" width="138" height="56" rx="7"/><text class="t" x="413.0" y="78.0" text-anchor="middle">Deliver</text>
<path class="ln" d="M318 74.0 H340" marker-end="url(#h)"/>
<rect class="b" x="508" y="46" width="138" height="56" rx="7"/><text class="t" x="577.0" y="71.0" text-anchor="middle">Retire what</text><text class="t" x="577.0" y="85.0" text-anchor="middle">closed</text>
<path class="ln" d="M482 74.0 H504" marker-end="url(#h)"/>
<path class="lp" d="M413.0 102 V132 H85.0 V106" marker-end="url(#h)"/>
<text class="s" x="249.0" y="147" text-anchor="middle">next ask is triaged and routed again</text>
</svg>
