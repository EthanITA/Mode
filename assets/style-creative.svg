<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 195" width="620" height="195" role="img" aria-label="The creative style replaces the first safe answer with several genuinely different options, spending boldness in one place and naming what it cost, while leaving the facts untouched.">
<style>
  .t{font:600 12px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#1f2328}
  .s{font:10.5px ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial;fill:#656d76}
  .k{font:600 9px ui-sans-serif,sans-serif;fill:#7d4e00;letter-spacing:.07em}
  .b{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
  .g{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
  .a{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
  .m{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
  .ln{stroke:#8c959f;stroke-width:1.5;fill:none}
  .lp{stroke:#8c959f;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  .at{fill:#6639ba}
  @media (prefers-color-scheme: dark){
    .t{fill:#e6edf3}.s{fill:#9198a1}.k{fill:#e3b341}
    .b{fill:#151b23;stroke:#3d444d}
    .g{fill:#2b2412;stroke:#d4a72c}
    .a{fill:#231c33;stroke:#a371f7}
    .m{fill:#0d1117;stroke:#3d444d}
    .ln,.lp{stroke:#6e7681}
    .at{fill:#c297ff}
  }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
<rect class="m" x="20" y="44" width="210" height="74" rx="7"/><text class="t" x="125.0" y="78.0" text-anchor="middle">The first safe</text><text class="t" x="125.0" y="92.0" text-anchor="middle">answer</text>
<rect class="a" x="390" y="44" width="210" height="74" rx="7"/><text class="t" x="495.0" y="78.0" text-anchor="middle">Several real</text><text class="t" x="495.0" y="92.0" text-anchor="middle">options, one bold</text>
<path class="ln" d="M242 81.0 H378" marker-end="url(#h)"/>
<text class="s" x="310.0" y="71.0" text-anchor="middle">the style</text>
<text class="s" x="20" y="30">what it would have been</text>
<text class="s at" x="390" y="30">what it becomes</text>
<text class="s" x="20" y="144">Genuinely different options, not one renamed three ways.</text>
<text class="s" x="20" y="159">The boldness is spent in one place, and its cost is named.</text>
<text class="s" x="20" y="174">Creativity is in the approach, never in the facts.</text>
</svg>
